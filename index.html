<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftSync | Enter Schedule</title>
    <link rel="stylesheet" href="css/main.css?v=5">
    <script src="app.js?v=5" defer></script>
</head>

<body>


    <main>
        <form id="calendarForm">
            <fieldset>
                <h1 id="formCaption">Enter Schedule</h1>
                <p>Convert your work shifts into calendar events.</p>

                <div class="eventTitle">
                    <label for="eventTitle">Calendar Event Title</label>
                    <input 
                        type="text" 
                        id="eventTitle" 
                        name="eventTitle" 
                        placeholder="e.g. Work Shift">

                </div>

                <div id="shiftFields">
                    <!-- 
                <div class="shiftRow">
                    <input type="date" id="date" required>
                    <input type="time" step="900" required>
                    <input type="time" step="900" required>
                </div> 
                -->

                </div>

                <div class="formButtons">
                    <button type="button" id="addShift">Add Shift</button>
                    <button type="button" id="removeShift">Remove Shift</button>
                    <button type="submit">Submit</button>
                </div>


            </fieldset>
            <p id="formSubmitted"></p>
        </form>


    </main>


</body>

</html>
